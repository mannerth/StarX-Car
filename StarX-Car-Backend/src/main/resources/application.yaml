server:
  port: ${SERVER_PORT:8080}

spring:

  application:
    name: starx-car

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}
    username: ${MYSQL_USERNAME:}
    password: ${MYSQL_PASSWORD:}

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 50MB

  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

mybatis-plus:

  mapper-locations:
    - classpath*:mapper/**/*.xml

  type-aliases-package: org.mannerth.starxcar

  configuration:

    map-underscore-to-camel-case: true

    cache-enabled: false

    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:

    banner: false

    db-config:

      id-type: auto

      table-underline: true

      logic-delete-field: deleted

      logic-delete-value: 1

      logic-not-delete-value: 0

logging:

  pattern:
    level: "%5p [traceId:%X{traceId:-}]"

  level:

    root: info

    org.mannerth.starxcar: debug

    org.springframework.security: info

springdoc:

  swagger-ui:

    path: /swagger-ui.html

    tags-sorter: alpha

    operations-sorter: alpha

  api-docs:

    path: /v3/api-docs

jwt:

  secret: ${JWT_SECRET}

  expire: ${JWT_EXPIRE:3600}

  refresh-expire: ${JWT_REFRESH_EXPIRE:604800}

admin:
  default-password: ${ADMIN_DEFAULT_PASSWORD}

amap:
  key: ${AMAP_KEY:}
  web-service-base-url: ${AMAP_WEB_SERVICE_BASE_URL:https://restapi.amap.com}
  driving-route-path: /v5/direction/driving
  connect-timeout-ms: ${AMAP_ROUTE_CONNECT_TIMEOUT_MS:3000}
  read-timeout-ms: ${AMAP_ROUTE_READ_TIMEOUT_MS:5000}

driver-location:
  freshness-seconds: ${DRIVER_LOCATION_FRESHNESS_SECONDS:30}
  max-recorded-time-future-seconds: ${DRIVER_LOCATION_MAX_RECORDED_TIME_FUTURE_SECONDS:60}


image-service:
  base-url: ${IMAGE_SERVICE_BASE_URL:https://image.foofish.work/api/v1}
  email: ${IMAGE_SERVICE_EMAIL:}
  password: ${IMAGE_SERVICE_PASSWORD:}
  strategy-id: ${IMAGE_SERVICE_STRATEGY_ID:}
