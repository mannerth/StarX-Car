spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration

jwt:
  secret: test-secret-for-context-loads-only
  expire: 3600
  refresh-expire: 604800

admin:
  default-password: test-default-password

amap:
  key: test-amap-key
  web-service-base-url: https://amap.test
  driving-route-path: /v5/direction/driving
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

driver-location:
  freshness-seconds: 30
  max-recorded-time-future-seconds: 60

reservation:
  dispatch-ahead-minutes: 30
  dispatch-interval-ms: 30000
  min-lead-minutes: 30
  max-advance-days: 7
  expire-grace-minutes: 30

file:
  upload-path: ./target/uploads

image-service:
  base-url: http://127.0.0.1:1/api/v1
  email: test@example.com
  password: test-password
