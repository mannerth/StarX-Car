name: starx_car_common
description: "Shared Flutter foundation for the StarX-Car Android passenger and driver applications."
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.8 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  amap_flutter_base:
    path: ../third_party/amap_flutter_base
  amap_flutter_map:
    path: ../third_party/amap_flutter_map
  amap_flutter_location:
    path: ../third_party/amap_flutter_location
  url_launcher: ^6.3.2
  # 9.x avoids the jni 1.x Android plugin, which requires a newer Gradle API
  # than the Flutter 3.44 Android template used by both mobile applications.
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# `path_provider` is pulled in by the Windows implementation of secure storage.
# Newer Android implementations use jni 1.x, whose Android Gradle script is
# incompatible with the Gradle configuration generated by Flutter 3.44.
dependency_overrides:
  path_provider_android: 2.2.22

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: com.mannerth.starxcar.common
        pluginClass: StarxCarCommonPlugin

  # To add assets to your package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

