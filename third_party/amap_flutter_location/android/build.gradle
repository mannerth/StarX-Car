group 'com.amap.flutter.amap_flutter_location'
version '1.0'

repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.library'

android {
    namespace 'com.amap.flutter.location'
    compileSdk 36

    defaultConfig {
        minSdkVersion 16
    }
    lint {
        disable 'InvalidPackage'
    }
    dependencies {
        compileOnly 'com.amap.api:location:6.5.1'
    }
}
